# docker-compose.yml
# Spins up MySQL + Postgres as "source systems" for the workshop.
# Runs on the EC2 instance (see ../ec2-setup/user-data.sh), not locally.
#
# TODO: point init scripts at ../../sample-datasets/ once finalized.

version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: source-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: changeme # TODO: move to .env / Secrets Manager
      MYSQL_DATABASE: source_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d # TODO: add init.sql here

  postgres:
    image: postgres:16
    container_name: source-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: changeme # TODO: move to .env / Secrets Manager
      POSTGRES_DB: source_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d # TODO: add init.sql here

volumes:
  mysql_data:
  postgres_data:
